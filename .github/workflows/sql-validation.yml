name: sql-validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sql_analytics_lab
          MYSQL_USER: analytics
          MYSQL_PASSWORD: analytics_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      
      - name: Liberar execução dos scripts
        run: chmod +x scripts/*.sh
      - name: Instalar cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Validar criação, seed e testes
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_TCP_PORT: 3306
          MYSQL_DATABASE: sql_analytics_lab
          MYSQL_USER: analytics
          MYSQL_PASSWORD: analytics_password
          MYSQL_ROOT_PASSWORD: root_password
        run: ./scripts/run-all.sh
