services:
  mysql:
    image: mysql:8.4
    container_name: sql-analytics-lab-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sql_analytics_lab}
      MYSQL_USER: ${MYSQL_USER:-analytics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-analytics_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3311}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./:/workspace:ro
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql_data:
